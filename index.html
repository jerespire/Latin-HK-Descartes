<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LATIN</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f6f3; --card: #ffffff; --border: #e0ddd6; --text: #1c1b18;
    --muted: #9b9890; --accent: #4a7c9e; --ok: #4a7c9e; --err: #b84040;
    --input: #f3f1ec; --r: 10px; --r-sm: 6px;
    --mono: 'JetBrains Mono', monospace; --serif: 'Cormorant Garamond', Georgia, serif;
  }
  [data-theme="dark"] {
    --bg: #0f0f10; --card: #18181a; --border: #2a2a2e; --text: #e0ddd6;
    --muted: #55544f; --accent: #6b9ec7; --ok: #6b9ec7; --err: #c06060; --input: #141416;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--serif); background: var(--bg); color: var(--text);
    font-size: 16px; line-height: 1.6; transition: background .2s, color .2s;
    overflow-x: hidden;
  }
  #welcome {
    position: fixed; inset: 0; z-index: 1000; background: var(--bg);
    display: flex; align-items: center; justify-content: center; transition: opacity .3s;
  }
  #welcome.hidden { opacity: 0; pointer-events: none; }
  .device-btns { display: flex; gap: 8px; }
  .device-btn {
    font-family: var(--mono); font-size: .68rem; letter-spacing: .14em;
    text-transform: uppercase; padding: .7rem 2.2rem; border: 1.5px solid var(--border);
    border-radius: var(--r); background: var(--card); color: var(--muted);
    cursor: pointer; transition: all .15s;
  }
  .device-btn:hover { border-color: var(--accent); color: var(--accent); }
  #app { min-height: 100vh; display: flex; flex-direction: column; opacity: 0; transition: opacity .3s; }
  #app.visible { opacity: 1; }
  header {
    display: flex; align-items: center; justify-content: space-between; padding: 0 2rem;
    height: 54px; background: var(--card); border-bottom: 1.5px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-family: var(--serif); font-size: 1.05rem; font-weight: 400;
    letter-spacing: .3em; text-transform: uppercase; color: var(--text);
  }
  .logo em { font-style: normal; color: var(--accent); }
  .theme-btn {
    width: 34px; height: 34px; border: 1.5px solid var(--border); border-radius: var(--r-sm);
    background: transparent; color: var(--muted); cursor: pointer; font-size: .85rem;
    display: flex; align-items: center; justify-content: center; transition: all .15s;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
  nav {
    display: flex; gap: 2px; background: var(--card); border-bottom: 1.5px solid var(--border);
    padding: 0 2rem;
  }
  .tab-btn {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .16em; text-transform: uppercase;
    padding: .85rem 1.3rem; border: none; border-bottom: 2px solid transparent;
    background: transparent; color: var(--muted); cursor: pointer; transition: color .15s;
    margin-bottom: -1.5px;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
  main { flex: 1; padding: 2rem; max-width: 1100px; width: 100%; margin: 0 auto; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
    overflow: hidden; margin-bottom: 1.5rem;
  }
  .card-header {
    padding: .75rem 1.25rem; border-bottom: 1.5px solid var(--border);
    font-family: var(--mono); font-size: .58rem; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted);
  }
  .sub-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.5rem; }
  .sub-btn {
    font-family: var(--mono); font-size: .57rem; letter-spacing: .1em; text-transform: uppercase;
    padding: .38rem .85rem; border: 1.5px solid var(--border); border-radius: var(--r-sm);
    background: var(--card); color: var(--muted); cursor: pointer; transition: all .15s;
  }
  .sub-btn:hover { border-color: var(--accent); color: var(--accent); }
  .sub-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-family: var(--serif); font-size: .93rem; }
  th {
    font-family: var(--mono); font-size: .56rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); padding: .6rem 1rem; border-bottom: 1.5px solid var(--border);
    text-align: left; font-weight: 400; background: var(--bg);
  }
  td { padding: .5rem 1rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .row-label {
    font-family: var(--mono); font-size: .58rem; letter-spacing: .1em; color: var(--muted);
    text-transform: uppercase; white-space: nowrap;
  }
  .cell-input {
    font-family: var(--serif); font-size: .93rem; background: var(--input);
    border: 1.5px solid var(--border); border-radius: var(--r-sm); color: var(--text);
    padding: .3rem .6rem; width: 100%; min-width: 80px; outline: none; transition: border-color .15s;
  }
  .cell-input:focus { border-color: var(--accent); }
  .cell-input.correct {
    border-color: var(--ok); color: var(--ok);
    background: color-mix(in srgb, var(--ok) 6%, var(--input));
  }
  .cell-input.wrong {
    border-color: var(--err); color: var(--err);
    background: color-mix(in srgb, var(--err) 6%, var(--input));
  }
  .correction-text {
    font-family: var(--mono); font-size: .58rem; color: var(--err); margin-top: 3px; display: block;
  }
  .action-bar {
    display: flex; gap: .6rem; align-items: center; margin-top: 1.5rem; padding-top: 1.2rem;
    border-top: 1.5px solid var(--border);
  }
  .btn-primary, .btn-ghost, .nav-word-btn {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .12em; text-transform: uppercase;
    padding: .58rem 1.5rem; border: 1.5px solid; border-radius: var(--r-sm); cursor: pointer;
    transition: all .15s; background: transparent;
  }
  .btn-primary { border-color: var(--accent); color: #fff; background: var(--accent); }
  .btn-primary:hover { opacity: .88; }
  .btn-ghost { border-color: var(--border); color: var(--muted); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .nav-word-btn { border-color: var(--border); color: var(--muted); }
  .nav-word-btn:hover { border-color: var(--accent); color: var(--accent); }
  .feedback {
    font-family: var(--mono); font-size: .6rem; letter-spacing: .06em; line-height: 1.9;
    padding: .65rem 1rem; border-radius: var(--r-sm); margin-bottom: 1.2rem; display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok {
    background: color-mix(in srgb, var(--ok) 10%, var(--card)); color: var(--ok);
    border: 1.5px solid color-mix(in srgb, var(--ok) 30%, var(--border));
  }
  .feedback.err {
    background: color-mix(in srgb, var(--err) 10%, var(--card)); color: var(--err);
    border: 1.5px solid color-mix(in srgb, var(--err) 30%, var(--border));
  }
  .id-layout { display: grid; grid-template-columns: 260px 1fr; gap: 1.5rem; align-items: start; }
  .word-display {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
    padding: 2rem 1.5rem; text-align: center;
  }
  .word-latin {
    font-family: var(--serif); font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 300;
    font-style: italic; color: var(--text); margin-bottom: .5rem; line-height: 1.3;
  }
  .word-counter {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .18em; color: var(--muted);
    text-transform: uppercase; display: block; margin-top: .8rem;
  }
  .id-form-card {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
    padding: 1.5rem; display: flex; flex-direction: column; gap: 1.1rem;
  }
  .id-group { display: flex; flex-direction: column; gap: .5rem; }
  .id-group label.group-title {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .16em; color: var(--muted);
    text-transform: uppercase; display: block;
  }
  .checkbox-grid { display: flex; flex-wrap: wrap; gap: .3rem .6rem; }
  .check-item {
    display: flex; align-items: center; gap: .3rem; font-family: var(--mono);
    font-size: .65rem; color: var(--text); cursor: pointer;
  }
  .check-item input[type=checkbox], .check-item input[type=radio] {
    width: 13px; height: 13px; accent-color: var(--accent); cursor: pointer;
  }
  .trad-layout { display: grid; grid-template-columns: 1fr 280px; gap: 1.5rem; align-items: start; }
  .trad-left {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); padding: 1.5rem;
  }
  .phrase-counter {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .16em; color: var(--muted);
    margin-bottom: .7rem;
  }
  .phrase-latin {
    font-family: var(--serif); font-size: 1.3rem; font-style: italic; font-weight: 300;
    color: var(--text); line-height: 1.8; margin-bottom: 1.2rem; padding-bottom: 1rem;
    border-bottom: 1.5px solid var(--border);
  }
  .trad-textarea {
    font-family: var(--serif); font-size: .95rem; background: var(--input);
    border: 1.5px solid var(--border); border-radius: var(--r-sm); color: var(--text);
    padding: .65rem .9rem; width: 100%; min-height: 76px; resize: vertical; outline: none;
    transition: border-color .15s; line-height: 1.6;
  }
  .trad-textarea:focus { border-color: var(--accent); }
  .trad-textarea.correct { border-color: var(--ok); }
  .trad-textarea.wrong { border-color: var(--err); }
  .correction-box {
    display: none; margin-top: .8rem; padding-top: .8rem; border-top: 1.5px solid var(--border);
  }
  .correction-box.show { display: block; }
  .correction-label {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ok); margin-bottom: .3rem;
  }
  .correction-text-trad { font-family: var(--serif); font-size: .95rem; color: var(--text); }
  .lexique {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r); overflow: hidden;
  }
  .lexique-header {
    font-family: var(--mono); font-size: .55rem; letter-spacing: .16em; text-transform: uppercase;
    color: var(--muted); padding: .65rem 1rem; border-bottom: 1.5px solid var(--border);
    background: var(--bg);
  }
  .lex-item { border-bottom: 1px solid var(--border); }
  .lex-item:last-child { border-bottom: none; }
  .lex-trigger {
    display: flex; align-items: center; justify-content: space-between; padding: .5rem 1rem;
    cursor: pointer; gap: .5rem; transition: background .12s;
  }
  .lex-trigger:hover { background: var(--bg); }
  .lex-word { font-family: var(--serif); font-style: italic; font-size: .9rem; color: var(--text); }
  .lex-arrow {
    font-family: var(--mono); font-size: .5rem; color: var(--muted); transition: transform .18s;
  }
  .lex-item.open .lex-arrow { transform: rotate(90deg); }
  .lex-details {
    display: none; padding: .4rem 1rem .6rem 1rem; font-family: var(--mono); font-size: .6rem;
    line-height: 1.6; color: var(--ok); border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--ok) 4%, var(--card));
  }
  .lex-item.open .lex-details { display: block; }
  .conj-display {
    background: var(--card); border: 1.5px solid var(--border); border-radius: var(--r);
    padding: 2rem 1.5rem; text-align: center; margin-bottom: 1.5rem;
  }
  .conj-goffiot {
    font-family: var(--serif); font-size: clamp(1.2rem, 3vw, 1.8rem); font-style: italic;
    color: var(--text); margin-bottom: .8rem; line-height: 1.4;
  }
  
  /* Mobile adaptations - Optimisé pour 2532x1170px (iPhone) */
  body[data-device="mobile"] {
    font-size: 15px;
  }
  body[data-device="mobile"] main { 
    padding: 1.2rem; 
    max-width: 100%;
  }
  body[data-device="mobile"] .id-layout,
  body[data-device="mobile"] .trad-layout { 
    grid-template-columns: 1fr; 
    gap: 1.2rem;
  }
  body[data-device="mobile"] header { 
    padding: 0 1.2rem; 
    height: 52px;
  }
  body[data-device="mobile"] .logo {
    font-size: 1rem;
    letter-spacing: .25em;
  }
  body[data-device="mobile"] .theme-btn {
    width: 38px;
    height: 38px;
    font-size: .9rem;
  }
  body[data-device="mobile"] nav { 
    padding: 0 .8rem; 
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    gap: 1px;
  }
  body[data-device="mobile"] .tab-btn { 
    padding: .8rem .9rem; 
    font-size: .58rem;
    white-space: nowrap;
    letter-spacing: .14em;
  }
  body[data-device="mobile"] .sub-tabs {
    gap: 6px;
  }
  body[data-device="mobile"] .sub-btn {
    padding: .4rem .85rem;
    font-size: .55rem;
  }
  body[data-device="mobile"] .word-display {
    padding: 1.8rem 1.2rem;
  }
  body[data-device="mobile"] .word-latin {
    font-size: clamp(1.6rem, 7vw, 2.4rem);
  }
  body[data-device="mobile"] .word-counter {
    font-size: .58rem;
    margin-top: .6rem;
  }
  body[data-device="mobile"] .phrase-latin {
    font-size: 1.2rem;
    line-height: 1.7;
  }
  body[data-device="mobile"] .phrase-counter {
    font-size: .58rem;
  }
  body[data-device="mobile"] .cell-input {
    font-size: .9rem;
    min-width: 70px;
    padding: .35rem .65rem;
  }
  body[data-device="mobile"] .trad-textarea {
    font-size: .92rem;
    min-height: 90px;
    padding: .7rem .85rem;
  }
  body[data-device="mobile"] th {
    font-size: .52rem;
    padding: .55rem .7rem;
  }
  body[data-device="mobile"] td {
    padding: .45rem .7rem;
  }
  body[data-device="mobile"] .row-label {
    font-size: .55rem;
  }
  body[data-device="mobile"] .card-header {
    font-size: .56rem;
    padding: .7rem 1.1rem;
  }
  body[data-device="mobile"] .id-form-card {
    padding: 1.2rem;
    gap: 1rem;
  }
  body[data-device="mobile"] .trad-left {
    padding: 1.2rem;
  }
  body[data-device="mobile"] .id-group label.group-title {
    font-size: .56rem;
  }
  body[data-device="mobile"] .check-item {
    font-size: .62rem;
  }
  body[data-device="mobile"] .check-item input[type=checkbox], 
  body[data-device="mobile"] .check-item input[type=radio] {
    width: 14px;
    height: 14px;
  }
  body[data-device="mobile"] .action-bar {
    flex-wrap: wrap;
    gap: .7rem;
    margin-top: 1.2rem;
    padding-top: 1.2rem;
  }
  body[data-device="mobile"] .btn-primary,
  body[data-device="mobile"] .btn-ghost,
  body[data-device="mobile"] .nav-word-btn {
    font-size: .57rem;
    padding: .55rem 1.3rem;
  }
  body[data-device="mobile"] .feedback {
    font-size: .58rem;
    padding: .7rem 1rem;
  }
  body[data-device="mobile"] .correction-text {
    font-size: .56rem;
  }
  body[data-device="mobile"] .conj-display {
    padding: 1.8rem 1.2rem;
  }
  body[data-device="mobile"] .conj-goffiot {
    font-size: clamp(1.1rem, 4vw, 1.6rem);
  }
  body[data-device="mobile"] .lexique-header {
    font-size: .56rem;
    padding: .7rem 1rem;
  }
  body[data-device="mobile"] .lex-word {
    font-size: .88rem;
  }
  body[data-device="mobile"] .lex-details {
    font-size: .58rem;
    padding: .45rem 1rem .65rem 1rem;
  }
  body[data-device="mobile"] .correction-label {
    font-size: .56rem;
  }
  body[data-device="mobile"] .correction-text-trad {
    font-size: .92rem;
  }
  body[data-device="mobile"] .card {
    margin-bottom: 1.2rem;
  }
  
  /* Ajustements spécifiques pour écran étroit en portrait */
  @media (max-width: 768px) and (orientation: portrait) {
    body[data-device="mobile"] .checkbox-grid {
      gap: .4rem .7rem;
    }
    body[data-device="mobile"] table {
      font-size: .88rem;
    }
  }
  
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body data-device="desktop">

<div id="welcome">
  <div class="device-btns">
    <button class="device-btn" onclick="selectDevice('desktop')">PC</button>
    <button class="device-btn" onclick="selectDevice('mobile')">Téléphone</button>
  </div>
</div>

<div id="app">
  <header>
    <span class="logo">LAT<em>I</em>N</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Thème clair / sombre">☾</button>
  </header>

  <nav>
    <button class="tab-btn active" data-tab="tableaux">Tableaux</button>
    <button class="tab-btn" data-tab="identification">Identification</button>
    <button class="tab-btn" data-tab="traduction">Traduction</button>
    <button class="tab-btn" data-tab="conjugaison">Groupe conjugaison</button>
  </nav>

  <main>
    <div id="panel-tableaux" class="panel active">
      <div class="sub-tabs" id="subTabs"></div>
      <div id="feedbackTableaux" class="feedback"></div>
      <div class="card">
        <div class="card-header" id="tableTitle">Tableau</div>
        <div class="table-wrap"><div id="tableContent"></div></div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" onclick="validerTableau()">Valider</button>
        <button class="btn-ghost" onclick="reinitTableau()">Réinitialiser</button>
      </div>
    </div>

    <div id="panel-identification" class="panel">
      <div id="feedbackId" class="feedback"></div>
      <div class="id-layout">
        <div class="word-display">
          <div class="word-latin" id="idWord">—</div>
          <span class="word-counter" id="idCounter">1 / 148</span>
        </div>
        <div class="id-form-card" id="idForm"></div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" onclick="validerIdentification()">Valider</button>
        <button class="btn-ghost" onclick="reinitIdentification()">Réinitialiser</button>
        <button class="nav-word-btn" onclick="nextWord()" style="margin-left:auto">Suivant →</button>
      </div>
    </div>

    <div id="panel-traduction" class="panel">
      <div class="trad-layout">
        <div class="trad-left">
          <div class="phrase-counter" id="tradCounter">Phrase 1 / 55</div>
          <div class="phrase-latin" id="tradPhrase">—</div>
          <textarea class="trad-textarea" id="tradInput" placeholder="Votre traduction…"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();validerTrad();}"></textarea>
          <div class="correction-box" id="tradCorrection">
            <div class="correction-label">Correction</div>
            <div class="correction-text-trad" id="tradCorrText"></div>
          </div>
        </div>
        <div>
          <div class="lexique" id="lexique">
            <div class="lexique-header">Lexique</div>
          </div>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" onclick="validerTrad()">Valider</button>
        <button class="btn-ghost" onclick="reinitTrad()">Réinitialiser</button>
        <button class="nav-word-btn" onclick="nextPhrase()" style="margin-left:auto">Phrase suivante →</button>
      </div>
    </div>

    <div id="panel-conjugaison" class="panel">
      <div id="feedbackConj" class="feedback"></div>
      <div class="conj-display">
        <div class="conj-goffiot" id="conjVerb">—</div>
        <span class="word-counter" id="conjCounter">1 / 38</span>
      </div>
      <div class="card">
        <div class="card-header">Identifier le groupe de conjugaison</div>
        <div style="padding: 1.5rem;">
          <div class="id-group">
            <label class="group-title">Conjugaison</label>
            <div class="checkbox-grid">
              <label class="check-item"><input type="radio" name="conjGroup" value="1"> 1ère conjugaison</label>
              <label class="check-item"><input type="radio" name="conjGroup" value="2"> 2ème conjugaison</label>
              <label class="check-item"><input type="radio" name="conjGroup" value="3"> 3ème conjugaison</label>
              <label class="check-item"><input type="radio" name="conjGroup" value="4"> 4ème conjugaison</label>
              <label class="check-item"><input type="radio" name="conjGroup" value="irr"> Irrégulier</label>
            </div>
          </div>
        </div>
      </div>
      <div class="action-bar">
        <button class="btn-primary" onclick="validerConjGroup()">Valider</button>
        <button class="btn-ghost" onclick="reinitConjGroup()">Réinitialiser</button>
        <button class="nav-word-btn" onclick="nextConjVerb()" style="margin-left:auto">Suivant →</button>
      </div>
    </div>
  </main>
</div>

<script>
function selectDevice(device) {
  document.body.dataset.device = device;
  const w = document.getElementById('welcome');
  w.classList.add('hidden');
  setTimeout(() => { w.style.display = 'none'; }, 450);
  document.getElementById('app').classList.add('visible');
}

function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? '' : 'dark');
  document.getElementById('themeBtn').textContent = isDark ? '☾' : '☀';
}

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

let currentTable = 0;

function buildSubTabs() {
  const wrap = document.getElementById('subTabs');
  wrap.innerHTML = '';
  TABLES.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'sub-btn' + (i === 0 ? ' active' : '');
    b.textContent = t.title;
    b.onclick = () => selectTable(i);
    wrap.appendChild(b);
  });
}

function selectTable(idx) {
  currentTable = idx;
  document.querySelectorAll('.sub-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
  renderTable();
  hideFeedback('feedbackTableaux');
}

function norm(s) {
  return s.trim().toLowerCase()
    .replace(/[àâä]/g,'a').replace(/[éèêë]/g,'e')
    .replace(/[îï]/g,'i').replace(/[ôö]/g,'o')
    .replace(/[ùûü]/g,'u').replace(/\s+/g,' ');
}

function renderTable() {
  const t = TABLES[currentTable];
  document.getElementById('tableTitle').textContent = t.title;
  let html = '<table><thead><tr>';
  t.headers.forEach(h => { html += '<th>' + h + '</th>'; });
  html += '</tr></thead><tbody>';
  t.rows.forEach((row, ri) => {
    html += '<tr><td class="row-label">' + row.label + '</td>';
    row.cells.forEach((cell, ci) => {
      if (cell.e) {
        html += '<td><input class="cell-input" data-row="' + ri + '" data-col="' + ci + '" data-answer="' + cell.v + '" placeholder="…" onkeydown="handleTableKey(event,' + ri + ',' + ci + ')"></td>';
      } else {
        html += '<td class="static-cell">' + cell.v + '</td>';
      }
    });
    html += '</tr>';
  });
  html += '</tbody></table>';
  document.getElementById('tableContent').innerHTML = html;
}

function handleTableKey(e, ri, ci) {
  if (e.key === 'Enter') {
    e.preventDefault();
    validerTableau();
  }
  if (e.key === 'Tab') {
    e.preventDefault();
    const t = TABLES[currentTable];
    const allInputs = [];
    const maxRows = t.rows.length;
    const maxCols = t.rows[0].cells.length;
    for (let col = 0; col < maxCols; col++) {
      for (let row = 0; row < maxRows; row++) {
        if (t.rows[row].cells[col].e) {
          allInputs.push({row, col});
        }
      }
    }
    const currentIdx = allInputs.findIndex(inp => inp.row === ri && inp.col === ci);
    const nextIdx = (currentIdx + 1) % allInputs.length;
    const next = allInputs[nextIdx];
    const nextInput = document.querySelector('.cell-input[data-row="' + next.row + '"][data-col="' + next.col + '"]');
    if (nextInput) nextInput.focus();
  }
}

function validerTableau() {
  const inputs = document.querySelectorAll('.cell-input');
  let total = 0, correct = 0;
  inputs.forEach(inp => {
    total++;
    inp.classList.remove('correct','wrong');
    const old = inp.parentElement.querySelector('.correction-text');
    if (old) old.remove();
    if (norm(inp.value) === norm(inp.dataset.answer)) {
      inp.classList.add('correct');
      correct++;
    } else {
      inp.classList.add('wrong');
      const span = document.createElement('span');
      span.className = 'correction-text';
      span.textContent = '→ ' + inp.dataset.answer;
      inp.parentElement.appendChild(span);
    }
  });
  showFeedback('feedbackTableaux', correct, total);
}

function reinitTableau() {
  const inputs = document.querySelectorAll('.cell-input');
  inputs.forEach(inp => {
    inp.value = '';
    inp.classList.remove('correct','wrong');
    const old = inp.parentElement.querySelector('.correction-text');
    if (old) old.remove();
  });
  hideFeedback('feedbackTableaux');
}

function renderWord() {
  const w = WORDS[wordIdx];
  document.getElementById('idWord').textContent = w.w;
  document.getElementById('idCounter').textContent = (wordIdx + 1) + ' / ' + WORDS.length;
}

function nextWord() {
  wordIdx = (wordIdx + 1) % WORDS.length;
  renderWord();
  buildIdForm();
  hideFeedback('feedbackId');
}

function validerIdentification() {
  const w = WORDS[wordIdx];
  const isVerb = w.type === 'verb';
  const errors = [], ok = [];

  function check(name, expected, label) {
    const el = document.querySelector('input[name="' + name + '"]:checked');
    if (!el) { errors.push(label + ' non renseigné (attendu : ' + expected + ')'); return; }
    if (norm(el.value) === norm(String(expected))) ok.push(label + ' ✓');
    else errors.push(label + ' : ' + el.value + ' → ' + expected);
  }

  if (!isVerb) {
    check('decl', w.decl, 'Déclinaison');
    check('genre', w.genre === 'FM' ? 'F/M' : w.genre, 'Genre');
    check('cas', w.cas, 'Cas');
    check('nb', w.nb, 'Nombre');
  } else {
    check('conj', w.conj, 'Conjugaison');
    check('temps', w.temps, 'Temps');
    check('pers', w.pers, 'Personne');
  }

  const tinp = document.getElementById('id-trad-input');
  tinp.classList.remove('correct','wrong');
  if (!tinp.value.trim()) {
    errors.push('Traduction non renseignée → ' + w.trad);
  } else {
    const userN = norm(tinp.value);
    const refN = norm(w.trad);
    const match = refN.split(/[,;\/]+/).some(part => {
      const p = part.trim();
      return userN === p || userN.includes(p) || p.includes(userN);
    });
    if (match) { ok.push('Traduction ✓'); tinp.classList.add('correct'); }
    else { errors.push('Traduction : "' + tinp.value + '" → ' + w.trad); tinp.classList.add('wrong'); }
  }

  const feedEl = document.getElementById('feedbackId');
  feedEl.classList.remove('show','ok','err');
  if (!errors.length) {
    feedEl.innerHTML = '✓ ' + ok.join(' · ');
    feedEl.classList.add('ok','show');
  } else {
    feedEl.innerHTML = '<strong>' + ok.length + ' / ' + (ok.length + errors.length) + ' correct' + (ok.length > 1 ? 's' : '') + '</strong><br>' +
      errors.map(e => '→ ' + e).join('<br>');
    feedEl.classList.add('err','show');
  }
}

function reinitIdentification() {
  wordIdx = 0;
  renderWord();
  buildIdForm();
  hideFeedback('feedbackId');
}

let phraseIdx = 0;

function renderPhrase() {
  const p = PHRASES[phraseIdx];
  document.getElementById('tradPhrase').textContent = p.latin;
  document.getElementById('tradCounter').textContent = 'Phrase ' + (phraseIdx + 1) + ' / ' + PHRASES.length;
  const inp = document.getElementById('tradInput');
  inp.value = '';
  inp.classList.remove('correct','wrong');
  document.getElementById('tradCorrection').classList.remove('show');
  buildLexique(p.lex);
}

function buildLexique(lex) {
  const el = document.getElementById('lexique');
  el.innerHTML = '<div class="lexique-header">Lexique</div>';
  lex.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'lex-item';
    div.innerHTML = '<div class="lex-trigger"><span class="lex-word">' + item.w + '</span><span class="lex-arrow">▶</span></div><div class="lex-details">' + item.t + '</div>';
    div.querySelector('.lex-trigger').addEventListener('click', () => {
      div.classList.toggle('open');
    });
    el.appendChild(div);
  });
}

function validerTrad() {
  const p = PHRASES[phraseIdx];
  const inp = document.getElementById('tradInput');
  const corr = document.getElementById('tradCorrection');
  document.getElementById('tradCorrText').textContent = p.trad;
  corr.classList.add('show');
  const userNorm = norm(inp.value);
  const refNorm = norm(p.trad);
  if (userNorm.length > 4) {
    const userWords = userNorm.split(/\s+/);
    const refWords = refNorm.split(/\s+/);
    const matches = userWords.filter(w => refWords.includes(w)).length;
    const ratio = matches / Math.max(refWords.length, 1);
    inp.classList.remove('correct','wrong');
    inp.classList.add(ratio >= 0.6 ? 'correct' : 'wrong');
  }
}

function reinitTrad() {
  const inp = document.getElementById('tradInput');
  inp.value = '';
  inp.classList.remove('correct','wrong');
  document.getElementById('tradCorrection').classList.remove('show');
}

function nextPhrase() {
  phraseIdx = (phraseIdx + 1) % PHRASES.length;
  renderPhrase();
}

// Fonction pour mélanger un tableau (algorithme Fisher-Yates)
function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

function validerConjGroup() {

  feedEl.classList.remove('show','ok','err');
  
  if (!el) {
    feedEl.innerHTML = 'Veuillez sélectionner une conjugaison.';
    feedEl.classList.add('err','show');
    return;
  }
  
  if (el.value === v.conj) {
    const conjLabel = v.conj === 'irr' ? 'irrégulier' : v.conj + 'ère/ème conjugaison';
    feedEl.innerHTML = '✓ Correct ! "' + v.goffiot + '" appartient au groupe ' + conjLabel;
    feedEl.classList.add('ok','show');
  } else {
    const conjLabel = v.conj === 'irr' ? 'irrégulier' : v.conj + 'ère/ème conjugaison';
    feedEl.innerHTML = 'Incorrect. "' + v.goffiot + '" appartient au groupe ' + conjLabel;
    feedEl.classList.add('err','show');
  }
}

function showFeedback(id, correct, total, msg) {
  const el = document.getElementById(id);
  el.classList.remove('ok','err');
  if (msg !== undefined && msg !== null) {
    el.innerHTML = msg;
    el.classList.add(correct === total ? 'ok' : 'err');
  } else {
    const all = correct === total;
    el.textContent = all
      ? '✓ Parfait — ' + correct + '/' + total + ' correct' + (correct > 1 ? 's' : '')
      : correct + '/' + total + ' correct' + (correct > 1 ? 's' : '') + ' — voir corrections ci-dessous';
    el.classList.add(all ? 'ok' : 'err');
  }
  el.classList.add('show');
}

function hideFeedback(id) {
  const el = document.getElementById(id);
  if (el) el.classList.remove('show','ok','err');
}
